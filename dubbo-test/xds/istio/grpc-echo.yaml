apiVersion: v1
kind: Namespace
metadata:
  name: dubbo-xds-test
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xds-echo
  namespace: dubbo-xds-test
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: dubbo-xds-test
spec:
  selector:
    app: xds-echo
  ports:
    - name: grpc
      port: 7070
      targetPort: 17070
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v1
  namespace: dubbo-xds-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xds-echo
      version: v1
  template:
    metadata:
      annotations:
        inject.istio.io/templates: grpc-agent
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
      labels:
        app: xds-echo
        version: v1
    spec:
      serviceAccountName: xds-echo
      containers:
        - name: app
          image: registry.istio.io/testing/app@sha256:4aa8031954c610230f17b70a2369007678efae912f9dc732edd9831f3244175c
          args:
            - --xds-grpc-server=17070
            - --grpc=17070
            - --grpc=17171
            - --port=8080
            - --version=v1
          env:
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: grpc
              containerPort: 17070
            - name: grpc-control
              containerPort: 17171
            - name: http-health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http-health
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
