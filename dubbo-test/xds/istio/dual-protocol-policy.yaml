apiVersion: v1
kind: Service
metadata:
  name: echo-dual
  namespace: dubbo-xds-test
spec:
  selector:
    app: xds-echo
  ports:
    - name: grpc-triple
      port: 7070
      targetPort: 17070
    - name: tcp-dubbo
      port: 7071
      targetPort: 20880
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo-dual
  namespace: dubbo-xds-test
spec:
  host: echo-dual.dubbo-xds-test.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 7070
        tls:
          mode: ISTIO_MUTUAL
      - port:
          number: 7071
        tls:
          mode: DISABLE
