# Ephemeral native Java ADS probe. Upload its build artifacts before touching /probe/ready.
apiVersion: v1
kind: Service
metadata:
  name: native-xds-probe
  namespace: dubbo-xds-test
spec:
  selector:
    app: native-xds-probe
  ports:
    - name: grpc
      port: 7070
      targetPort: 17070
---
apiVersion: v1
kind: Pod
metadata:
  name: native-xds-probe
  namespace: dubbo-xds-test
  annotations:
    inject.istio.io/templates: grpc-agent
    proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  labels:
    app: native-xds-probe
spec:
  serviceAccountName: xds-echo
  restartPolicy: Never
  containers:
    - name: app
      image: eclipse-temurin@sha256:e0c60c487345d1dc9d0fc7b6f0496f3cc941e5132e09296cc17a6decc71b902b
      command: ["sh", "-c"]
      args:
        - >-
          while [ ! -f /probe/ready ]; do sleep 1; done;
          java -Xmx256m -cp '/probe/*' org.apache.dubbo.xds.tools.XdsProbe
          echo.dubbo-xds-test.svc.cluster.local 7070 0.0.0.0:17070;
          echo $? > /probe/exit-code;
          touch /probe/done;
          sleep 3600
      ports:
        - name: grpc
          containerPort: 17070
      volumeMounts:
        - name: probe
          mountPath: /probe
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
  volumes:
    - name: probe
      emptyDir: {}
