apiVersion: v1
kind: Service
metadata:
  name: echo-policy
  namespace: dubbo-xds-test
spec:
  selector:
    app: xds-echo
  ports:
    - name: grpc
      port: 7070
      targetPort: 17070
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo-policy
  namespace: dubbo-xds-test
spec:
  host: echo-policy.dubbo-xds-test.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        http2MaxRequests: 2
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutive5xxErrors: 2
      interval: 1s
      baseEjectionTime: 2s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: echo-policy
  namespace: dubbo-xds-test
spec:
  hosts:
    - echo-policy.dubbo-xds-test.svc.cluster.local
  http:
    - fault:
        delay:
          fixedDelay: 20ms
          percentage:
            value: 10
        abort:
          grpcStatus: UNAVAILABLE
          percentage:
            value: 10
      route:
        - destination:
            host: echo-policy.dubbo-xds-test.svc.cluster.local
            port:
              number: 7070
