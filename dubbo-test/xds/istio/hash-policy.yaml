apiVersion: v1
kind: Service
metadata:
  name: echo-ring
  namespace: dubbo-xds-test
spec:
  selector:
    app: xds-echo
  ports:
    - name: grpc
      port: 7070
      targetPort: 17070
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo-ring
  namespace: dubbo-xds-test
spec:
  host: echo-ring.dubbo-xds-test.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      consistentHash:
        httpHeaderName: x-user
        ringHash:
          minimumRingSize: 1024
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: echo-ring
  namespace: dubbo-xds-test
spec:
  hosts:
    - echo-ring.dubbo-xds-test.svc.cluster.local
  http:
    - route:
        - destination:
            host: echo-ring.dubbo-xds-test.svc.cluster.local
            port:
              number: 7070
---
apiVersion: v1
kind: Service
metadata:
  name: echo-maglev
  namespace: dubbo-xds-test
spec:
  selector:
    app: xds-echo
  ports:
    - name: grpc
      port: 7070
      targetPort: 17070
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo-maglev
  namespace: dubbo-xds-test
spec:
  host: echo-maglev.dubbo-xds-test.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      consistentHash:
        httpHeaderName: x-user
        maglev:
          tableSize: 65537
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: echo-maglev
  namespace: dubbo-xds-test
spec:
  hosts:
    - echo-maglev.dubbo-xds-test.svc.cluster.local
  http:
    - route:
        - destination:
            host: echo-maglev.dubbo-xds-test.svc.cluster.local
            port:
              number: 7070
