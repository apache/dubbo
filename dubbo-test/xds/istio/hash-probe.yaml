apiVersion: v1
kind: Pod
metadata:
  name: native-xds-hash-probe
  namespace: dubbo-xds-test
  annotations:
    inject.istio.io/templates: grpc-agent
    proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  labels:
    app: native-xds-hash-probe
spec:
  serviceAccountName: xds-echo
  restartPolicy: Never
  containers:
    - name: app
      image: eclipse-temurin@sha256:e0c60c487345d1dc9d0fc7b6f0496f3cc941e5132e09296cc17a6decc71b902b
      command: ["sh", "-c"]
      args:
        - >-
          while [ ! -f /probe/ready ]; do sleep 1; done;
          java -Xmx256m -cp '/probe/*' org.apache.dubbo.xds.tools.XdsResourceCapture
          echo-ring.dubbo-xds-test.svc.cluster.local 7070 /probe/ring;
          ring_status=$?;
          java -Xmx256m -cp '/probe/*' org.apache.dubbo.xds.tools.XdsResourceCapture
          echo-maglev.dubbo-xds-test.svc.cluster.local 7070 /probe/maglev;
          maglev_status=$?;
          if [ "$ring_status" -ne 0 ] || [ "$maglev_status" -ne 0 ]; then
          echo 1 > /probe/exit-code; else echo 0 > /probe/exit-code; fi;

          touch /probe/done;
          sleep 3600
      volumeMounts:
        - name: probe
          mountPath: /probe
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
  volumes:
    - name: probe
      emptyDir: {}
